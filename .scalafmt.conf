version = 3.11.5
maxColumn = 120

# `-Xsource:3` is on for 2.13, and the version-specific trees use each version's own syntax
runner.dialect = scala213source3

fileOverride {
  "glob:**/src/*/scala-3/**" { runner.dialect = scala3 }
  "glob:**/project/*.scala" { runner.dialect = scala212 }
}

# conservative on purpose: reformat what the sources already look like rather than restyling them,
# so a formatting commit stays reviewable
newlines.source = keep
docstrings.style = SpaceAsterisk
docstrings.wrap = no
align.preset = some
